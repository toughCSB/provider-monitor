name: ProviderMonitor
options:
  bundleIdPrefix: com.toughcsb
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # The GitHub release updater compares MARKETING_VERSION, while macOS also
    # uses CURRENT_PROJECT_VERSION as the monotonically increasing build number.
    # Bump both on every release.
    MARKETING_VERSION: "1.17.2"
    CURRENT_PROJECT_VERSION: "23"
    # Signed with a stable identity on purpose. The app reads Claude Code's
    # OAuth token out of the login keychain, and the keychain's ACL remembers
    # *which signed binary* was allowed. Ad-hoc or unsigned builds get a new
    # identity on every rebuild, so "Always Allow" would be forgotten each time
    # and the prompt would come back after every `make run`.
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 6WFPL8B9FB
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Required by notarization. Worth knowing what it does *not* break here:
    # the keychain read is unaffected (the ACL keys on the signing identity,
    # which is unchanged), and reading Cursor's and Codex's SQLite files is
    # ordinary file access. It is the App Sandbox that would break both, which
    # is why that stays off — Developer ID distribution does not require it.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: "2.102.0"

targets:
  ProviderMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          # Notes for whoever next re-generates the vendored decoder. Left in the
          # navigator beside the code it describes, but Xcode would otherwise
          # copy any unrecognised file into the app bundle's Resources, and a
          # developer README has no business shipping to users.
          - "Vendor/**/README.md"
    dependencies:
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIO
        product: NIOPosix
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Provider Monitor
        CFBundleDisplayName: Provider Monitor
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - fr
          - de
          - ja
          - pt-BR
          - ru
          - zh-Hans
          - uk
          - ko
        LSMinimumSystemVersion: "15.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "Provider Monitor answers your phone on this network so it can show your usage."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toughcsb.providermonitor
        # Xcode otherwise registers every Debug/Release bundle in DerivedData
        # as another installed app. Only the canonical /Applications copy
        # should appear in app search and LaunchServices.
        REGISTER_WITH_LAUNCH_SERVICES: "NO"
        # What Finder, the Dock and the menu bar show. The module stays one
        # word so `import` and `@testable import` are not spelled with an
        # underscore.
        PRODUCT_NAME: "Provider Monitor"
        PRODUCT_MODULE_NAME: ProviderMonitor
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        DEVELOPMENT_LANGUAGE: en
        # The only C in the project is the vendored Zstandard decoder, and this
        # is how Swift sees it. It is needed because Claude Desktop's HTTP cache
        # stores bodies with `content-encoding: zstd` and macOS ships no zstd
        # anywhere a signed, notarized app can reach — see
        # Sources/Vendor/zstd/README.md. Delete this line and that directory
        # together if the Desktop source is ever dropped.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ProviderMonitor-Bridging-Header.h

  ProviderMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ProviderMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toughcsb.providermonitor.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # XcodeGen derives TEST_HOST and BUNDLE_LOADER from the *target* name,
        # which would look for ProviderMonitor.app — while the product this
        # target links against is "Provider Monitor.app", because PRODUCT_NAME
        # says so. Without these two the test bundle has no host to load into
        # and `xcodebuild test` fails with "Could not find test host".
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Provider Monitor.app/Contents/MacOS/Provider Monitor"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ProviderMonitor:
    build:
      targets:
        ProviderMonitor: all
        ProviderMonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProviderMonitorTests
