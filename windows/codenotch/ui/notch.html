<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  :root{
    /* macOS Sources/Notch/NotchLayout.swift is the product geometry. Keep these
       explicit: windows/scripts/check-macos-ui-parity.mjs blocks accidental drift. */
    --notch-depth:70px;
    --horizontal-notch-depth:96px;
    --ring-size:44px;
    --cell-gap:31px;
    --glyph-size:17px;
    --card-width:226px;
    --card-radius:19px;
    --card-padding:12px;
    --badge-height:12px;
    --surface:rgba(29,29,31,.97);
    --surface-raised:rgba(47,47,49,.96);
  }
  #root{position:relative;width:100%;height:100%}

  /* The pill on the right edge */
  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:var(--notch-depth);padding:26px 0 19px;background:var(--surface);
    border-radius:30px 0 0 30px;
    /* Stays visible on dark wallpapers: a thin stroke plus a faint glow, the only outline when black sits on black */
    border:1px solid rgba(255,255,255,.10);border-right:none;
    box-shadow:none;
    backdrop-filter:blur(24px) saturate(1.15);
    display:flex;flex-direction:column;align-items:center;gap:var(--cell-gap);cursor:pointer;
  }
  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. A 1 px
     ring in the stroke colour joins the pill's own stroke (the outline cue on black wallpapers). */
  #pill::before,#pill::after{
    content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none;
  }
  #pill{--fillet:11px}
  #pill::before{
    top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), rgba(255,255,255,.10) calc(var(--fillet) - 0.5px), #1d1d1f calc(var(--fillet) + 0.5px));
  }
  #pill::after{
    bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), rgba(255,255,255,.10) calc(var(--fillet) - 0.5px), #1d1d1f calc(var(--fillet) + 0.5px));
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px}
  .ringwrap{position:relative;width:var(--ring-size);height:var(--ring-size)}
  .ringwrap > svg.ring{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  /* Which window the ring actually resolved to — M/W/5h, top-left of the ring so it reads at a
     glance without a hover. */
  .limit-badge{
    position:absolute;top:-4px;left:-4px;min-width:14px;height:var(--badge-height);padding:0 3px;
    border-radius:6px;background:#141414;border:1px solid #5a5a5a;
    font-size:8px;font-weight:600;color:#f0f0f0;line-height:10px;text-align:center;
    letter-spacing:-.2px;font-variant-numeric:normal;pointer-events:none;
  }
  .limit-badge:empty{display:none}
  /* One colour per cadence so W/M/5h are told apart at a glance, not just by the letter */
  .limit-badge.lim-weekly{border-color:#4EA1FF;color:#8ec4ff}
  .limit-badge.lim-monthly{border-color:#B47CFF;color:#d3b3ff}
  .limit-badge.lim-5h{border-color:#FF9F45;color:#ffc389}
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:var(--glyph-size);font-weight:700;color:#e8e8ea;letter-spacing:-.5px;
  }
  .glyph.small{font-size:13px}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:var(--glyph-size);height:var(--glyph-size);color:#e8e8ea}
  .glyph .mark svg{width:var(--glyph-size);height:var(--glyph-size);fill:currentColor}
  .glyph img.png{width:var(--glyph-size);height:var(--glyph-size);object-fit:contain}
  .glyph img.appicon{width:20px;height:20px;border-radius:6px;object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:#e8e8ea;margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:14px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;line-height:17px}
  .dim{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .cell.is-pending svg.ring{transform:scale(.94);transform-origin:center;filter:brightness(1.4)}
  .cell.is-refreshing svg.ring{animation:spin .8s linear infinite;transform-origin:center}
  .cell.is-refreshing .pct{animation:pulse .8s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.cell.is-refreshing svg.ring,.cell.is-refreshing .pct{animation:none}.cell.is-refreshing .pct{opacity:.55}}
  /* A 60 fps SVG transform animation in a transparent always-on-top window slows the whole desktop
     compositor (other apps stutter). steps() drops repaints to ~10 fps; it still reads as spinning/breathing. */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  /* Windows' Animation effects switch: a still arc and a solid ring, as on the Mac under Reduce Motion */
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}}

  /* Hover card, shown to the left of the pill */
  #card{
    position:absolute;left:10px;right:100px;top:50%;transform:translateY(-50%);
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed).
       The 246 cap matches the upstream spec. */
    width:var(--card-width);max-width:var(--card-width);margin-left:auto;background:var(--surface);border-radius:var(--card-radius);padding:var(--card-padding);
    border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(24px) saturate(1.15);
    overflow-wrap:anywhere;min-width:0;
    /* A provider can expose more rows than fit on a short or heavily scaled display. Never delete
       those rows: keep the card on-screen and make its body scrollable as the safe fallback. */
    max-height:calc(100% - 16px);overflow-x:hidden;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:#555 transparent;
    display:none;
  }
  #card.show{display:block}
  /* The tail, its point on the hovered ring: the Mac's curved wedge (TooltipTail), whose shoulders
     leave the card tangent to its edge so the two read as one shape. An element of its own rather
     than ::after, so the card's overflow cannot clip it and it can be reported as hot. It spans the
     whole gap, its tip tucked 1 px under the pill's edge so the two meet. */
  #tail{
    position:absolute;right:69px;width:28px;height:33px;background:#1d1d1f;display:none;
    clip-path:path('M0 0C0 8.25 16.24 12.54 28 16.5C16.24 20.46 0 24.75 0 33Z');
  }
  #card.show + #tail{display:block}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:13px;font-weight:700}
  .c-sub{font-size:11px;color:#808080;margin-bottom:10px}
  /* The two resets people actually watch, called out large above the per-window detail list */
  /* Quick switch for which window the ring/graph reads — weekly by default, one click to change it */
  .c-limit{display:flex;align-items:center;gap:6px;margin:2px 0 10px;flex-wrap:wrap}
  .c-limit-label{font-size:10px;font-weight:600;color:#808080;text-transform:uppercase;letter-spacing:.3px}
  .lim-btn{
    background:#141414;border:1px solid #242424;border-radius:7px;color:#b0b0b3;font:inherit;
    font-size:11px;padding:3px 8px;cursor:pointer;
  }
  .lim-btn:hover{border-color:#3f3f3f;color:#e8e8ea}
  .lim-btn.on{background:#2a2a2a;border-color:#8a8a8a;color:#fff;font-weight:600}
  .reset-hero{display:flex;gap:9px;margin:2px 0 10px;padding:9px;background:var(--surface-raised);border-radius:11px}
  .reset-item{flex:1;min-width:0;text-align:center}
  .reset-label{font-size:10px;font-weight:600;color:#808080;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;overflow-wrap:anywhere}
  .reset-time{font-size:15px;font-weight:700;color:#fff;overflow-wrap:anywhere}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:#e8e8ea;font-weight:600;white-space:nowrap}
  .w-reset{color:#808080;font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:#2d2d2d;margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:#808080}
  .g-head{font-size:12px;font-weight:700;color:#e8e8ea;margin-top:12px}
  .g-box{border:1px solid #242424;border-radius:10px;padding:0 10px 8px;margin-top:6px}
  .c-note{font-size:12px;color:#c8c8c8;line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid #1e1e1e;padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#b0b0b3;padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-more{font-size:11px;color:#808080;padding:2px 0}
  /* Size slider — the last row of the hover card. Only the pill is scaled, so this row keeps its
     own size and does not move out from under the cursor while it is being dragged. */
  .c-scale{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid #1e1e1e}
  .c-scale input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;background:#2d2d2d;outline:none}
  .c-scale input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#2d2d2d}
  .c-scale input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-3.5px;border-radius:50%;background:#8a8a8a;cursor:pointer}
  .c-scale-val{font-size:10px;color:#808080;min-width:30px;text-align:right}

  #notice{
    position:absolute;left:8px;bottom:6px;right:80px;font-size:10px;color:#808080;
    background:rgba(0,0,0,.85);border-radius:8px;padding:4px 8px;display:none
  }
  #notice.show{display:block}

  /* Right-click menu on the pill/card — a right-click over a NOACTIVATE transparent window would
     otherwise either do nothing or show WebView2's own dev menu, neither of which is a place to
     put a setting. Built the same way the hover card is: absolutely positioned, shown/hidden by a
     class, never by taking focus. */
  #ctxmenu{
    position:absolute;min-width:180px;background:#161616;border:1px solid #2e2e2e;border-radius:10px;
    padding:5px;box-shadow:0 4px 18px rgba(0,0,0,.5);display:none;z-index:10;
  }
  #ctxmenu.show{display:block}
  .ctx-item{
    display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:#e8e8ea;
    font:inherit;font-size:12px;text-align:left;padding:7px 8px;border-radius:7px;cursor:pointer;
  }
  .ctx-item:hover{background:#242424}
  .ctx-check{width:14px;flex:0 0 auto;color:#8ec4ff;font-size:12px}
  .ctx-sep{height:1px;background:#303030;margin:4px 6px}

  /* Edge parity with macOS. The same DOM rotates rather than maintaining four renderers: side
     edges stack cells vertically, top/bottom run them horizontally, and every tooltip opens
     inward from the bezel. */
  body[data-edge="left"] #pill{
    left:0;right:auto;border-radius:0 30px 30px 0;border-left:none;border-right:1px solid rgba(255,255,255,.10)
  }
  body[data-edge="left"] #pill::before,body[data-edge="left"] #pill::after{left:0;right:auto;transform:scaleX(-1)}
  body[data-edge="left"] #card{left:100px;right:10px;margin-left:0;margin-right:auto}
  body[data-edge="left"] #tail{left:69px;right:auto;transform:rotate(180deg)}

  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{
    left:50%;right:auto;width:auto;height:var(--horizontal-notch-depth);padding:0 26px 0 26px;
    flex-direction:row;transform:translateX(-50%)
  }
  body[data-edge="top"] #pill{top:0;bottom:auto;border-radius:0 0 30px 30px;border-top:none}
  body[data-edge="bottom"] #pill{top:auto;bottom:0;border-radius:30px 30px 0 0;border-bottom:none}
  body[data-edge="top"] #pill::before,body[data-edge="top"] #pill::after,
  body[data-edge="bottom"] #pill::before,body[data-edge="bottom"] #pill::after{display:none}
  body[data-edge="top"] #card{top:126px;bottom:auto;right:auto;margin:0;transform:none;max-height:calc(100% - 134px)}
  body[data-edge="bottom"] #card{top:auto;bottom:126px;right:auto;margin:0;transform:none;max-height:calc(100% - 134px)}
  body[data-edge="top"] #tail{top:95px;bottom:auto;right:auto;transform:rotate(-90deg)}
  body[data-edge="bottom"] #tail{top:auto;bottom:95px;right:auto;transform:rotate(90deg)}
</style>

/* Colour ramp (upstream palette values) */
const AMPLE='#00FF88', WATCH='#F2FF00', CRIT='#FF3F00';

// Whole percents, except where rounding would read as nothing used or nothing left, as the Mac's Percent does
function smallPct(v){
  if(v<=0) return '0';
  const t=Math.round(v*10)/10;
  if(t<0.1) return '<0.1';
  if(t>99.9) return '99.9';
  return t.toFixed(1);
}
function pctText(f){ const v=f*100; return v>0&&v<1?smallPct(v):String(Math.round(v)); }
let percentBasis='remaining';
function ringPercent(w){
  const used=Math.max(0,Math.min(w.used,1));
  return percentBasis==='used'?used:1-used;
}
// Both ends, since vendors disagree on which they print; the left half comes from the rounded used half, as their dashboards do
// The ring number and every graph use the same chosen basis. The colour still describes risk from
// usage, so 15% remaining is a short red arc while 85% remaining is a long green one.
function usedCopy(w){
  const used=pctText(Math.max(0,Math.min(w.used,1)));
  const left=pctText(Math.max(0,1-Math.min(w.used,1)));
  const prefix=w.derived?'~':'';
  if(uiLang==='ko') return `${prefix}${used}% 사용 · ${prefix}${left}% 남음`;
  if(uiLang==='ru') return `${prefix}${used}% использовано · ${prefix}${left}% осталось`;
  return `${prefix}${used}% used · ${prefix}${left}% remaining`;
}

// (not an official brand colour). OpenCode's real mark is plain white, same as the page's default
// glyph colour — so it is left untinted, matching the actual icon rather than inventing a colour for it.
const BRAND_TINT={codex:'#10A37F',cursor:'#3B82F6',grok:'#8B5CF6'};

// source package). The pill cell and the hover-card header can both inline the same glyph at once,
// and renderCard() replaces #card's innerHTML on every hover change — so two copies of the same id
// end up in the DOM, and once the older copy is torn down, the surviving mask="url(#id)" reference
// dangles and the browser renders the shape unmasked: a plain colourful block instead of the mark's
// real outline (looked like a flickering, then a stuck, square). Every inlined copy gets its own
// suffix on every id it defines and every #id it references, so no two copies can ever collide.
let glyphInstanceSeq=0;
function uniqueSvgIds(svgText,tag){
  const ids=new Set();

  const suffix='__'+tag+(glyphInstanceSeq++);
  let out=svgText;
  for(const id of ids){
    const esc=id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp('id="'+esc+'"','g'),'id="'+id+suffix+'"');
    out=out.replace(new RegExp('#'+esc+'\\b','g'),'#'+id+suffix);

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return uiLang==='ru'?'Сброс…':uiLang==='ko'?'재설정 중…':'Resetting…';
  const min=Math.round(diff/60000); // rounded before the test, so 59m40s never reads "Resets in 60 min"
  if(min<60) return uiLang==='ru'?`Сброс через ${Math.max(1,min)} мин`:uiLang==='ko'?`${Math.max(1,min)}분 후 재설정`:`Resets in ${Math.max(1,min)} min`;
  const d=new Date(ms);
  const locale=uiLang==='ru'?'ru-RU':uiLang==='ko'?'ko-KR':'en-US';
  const resets=uiLang==='ru'?'Сброс:':uiLang==='ko'?'재설정:':'Resets';
  // A weekday only names a day in the coming week: a Codex monthly reset 26 days out read as this Monday
  if(daysApart(Date.now(),ms)>=7) return `${resets} ${d.toLocaleDateString(locale,{month:'short',day:'numeric'})}`;
  const t=d.toLocaleTimeString(locale,{hour:'numeric',minute:'2-digit',hourCycle:stateSnap.clock_24h?'h23':'h12'});
  if(diff<24*60*60*1000) return uiLang==='ko'?`${t}에 재설정`:`${uiLang==='ru'?'Сброс в':'Resets at'} ${t}`;
  return `${resets} ${d.toLocaleDateString(locale,{weekday:'short'})} ${t}`;
}
// Calendar days rather than 24-hour blocks, so a clock change cannot move the answer
function daysApart(from,to){
  const day=ms=>{const d=new Date(ms); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();};
  return Math.round((day(to)-day(from))/86400000);
}

function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);
  if(uiLang==='ru') return m<60?`${m} мин назад`:`${Math.round(m/60)} ч назад`;
  if(uiLang==='ko') return m<60?`${m}분 전`:`${Math.round(m/60)}시간 전`;
  return m<60?`${m}m ago`:`${Math.round(m/60)}h ago`;
}

function heroDuration(ms){

function limitRowHtml(id){
  const cur=limitFor(id);
  const btn=v=>`<button class="lim-btn${cur===v?' on':''}" data-lim="${v}">${esc(textCopy(v==='automatic'?'Default':v==='weekly'?'Weekly':v==='monthly'?'Monthly':'5h'))}</button>`;
  return `<div class="c-limit"><span class="c-limit-label">${esc(textCopy('Ring shows'))}</span>${LIMIT_CHOICES.map(btn).join('')}</div>`;
}
function wireLimitRow(id){
  const row=document.querySelector('#card .c-limit'); if(!row) return;
  row.querySelectorAll('.lim-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      const v=b.dataset.lim; if(v===limitFor(id)) return;
      ringLimits={...ringLimits,[id]:v};
      renderRing();
      if(card.classList.contains('show')){renderCard();armWatchdog();}
      invoke('set_ring_limit',{provider:id,limit:v}).catch(e=>notice('set_ring_limit failed: '+e));
    });
  });
}

let hoverId='claude';
function renderCard(){
  const c=document.getElementById('card');
  const p=providers().find(x=>x.id===hoverId)||providers()[0];
  const snap=p.snap;
  const headIcon=glyphHtml(p,true);
  const title=uiLang==='ru'?'Использование '+p.name:uiLang==='ko'?`${p.name} ${textCopy('Usage')}`:`${p.name} Usage`;
  let html=`<div class="c-head">${headIcon}<span class="c-title">${title}</span></div>`;
  if(snap.windows.length){
    // The two resets people actually watch lead directly under the header. Antigravity has one
    // 5-hour lane per model family, so resolve that lane in the same selected family as the ring.
    const heroLead=headlineOf(snap,p.id);
    const family=p.id==='gemini'?snap.windows.filter(w=>laneFamily(w)===agPrefs.model):snap.windows;
    const candidates=family.length?family:snap.windows;
    const hero5h=tightestOf(candidates.filter(w=>laneIs(w,'5h')));
    const heroItem=w=>`<div class="reset-item"><div class="reset-label">${esc(textCopy(w.label))}</div><div class="reset-time">${heroDuration(w.resets_at)}</div></div>`;
    if(heroLead||(hero5h&&hero5h!==heroLead)){
      html+=`<div class="reset-hero">`;
      if(heroLead) html+=heroItem(heroLead);
      if(hero5h&&hero5h!==heroLead) html+=heroItem(hero5h);
      html+=`</div>`;
    }
  }
  html+=limitRowHtml(p.id);
  if(staleOf(snap)&&snap.fetched_at) html+=`<div class="c-sub">${textCopy('Updated')} ${ago(snap.fetched_at)}</div>`;
  if(snap.status==='needsAuth'){
    const who={claude:'Sign in to Claude Code to see usage.',cursor:'Sign in to Cursor to see usage.',codex:'Sign in to Codex to see usage.',gemini:'Sign in to Antigravity to see usage.',grok:'Sign in to Grok to see usage.',opencode:'Sign in to OpenCode to see usage.',glm:'Sign in to GLM Code to see usage.',devin:'Sign in to Devin to see usage.',commandcode:'Sign in to Command Code to see usage.',kimi:'Sign in to Kimi Code to see usage.',copilot:'Sign in to GitHub Copilot to see usage.',kiro:'Sign in to Kiro to see usage.'}[p.id]||'';
    html+=`<div class="c-note">${textCopy(who)}<br>${esc(textCopy(snap.note||''))}</div>`;
  }else if(snap.status==='stale'&&snap.note&&p.id==='grok'){
    html+=`<div class="c-note">${esc(textCopy(snap.note))}</div>`;
  }else if(!snap.windows.length){
    html+=`<div class="c-note">${esc(textCopy(snap.note||'Waiting for first reading…'))}</div>`;
  }else{
    // Windows that share a group (Antigravity's model families) sit in one box under its name, as on the Mac
    let group=null;
    for(const w of snap.windows){
      if((w.group||null)!==group){
        if(group) html+=`</div>`;
        group=w.group||null;
        if(group) html+=`<div class="g-head">${esc(textCopy(group))}</div><div class="g-box">`;
      }
      if(w.count!=null){
        html+=`<div class="win"><div class="w-row"><span class="w-label">${esc(textCopy(w.label))}</span></div>
          <div class="w-used">${w.count>0?`~${w.count} ${textCopy(w.count===1?'request today':'requests today')}`:textCopy('no requests today')}</div></div>`;
        continue;
      }
      html+=`<div class="win">
        <div class="w-row"><span class="w-label">${esc(textCopy(w.label))}</span><span class="w-reset">${resetCopy(w.resets_at)}</span></div>
        <div class="w-track"><div class="w-fill" style="width:${(ringPercent(w)*100).toFixed(0)}%;background:${tone(w.used)}"></div></div>
        <div class="w-used">${esc(usedCopy(w))}</div>
      </div>`;
    }
    if(group) html+=`</div>`;
    if(snap.note) html+=`<div class="c-note">${esc(textCopy(snap.note))}</div>`;
  }
  if(p.id==='claude'){ // live sessions (a full list with jump-to-session is a follow-up)
    const act=stateSnap.sessions.filter(s=>s.state!=='idle');
    if(act.length){
      html+=`<div class="c-sessions">`;
      for(const s of act.slice(0,SESSION_ROWS)){
        html+=`<div class="s-row"><span class="s-dot" style="background:${STATE_DOT[s.state]||'#666'}"></span>${esc(s.title)}</div>`;
      }
      html+=moreRow(act.length-SESSION_ROWS)+`</div>`;
    }
  }else{ // other providers: detected activity rows (Cursor reports state; Codex/Antigravity are inferred from recent writes)
    // Waiting before busy, newest first within each, so what gets cut is what matters least
    const acts=activity.filter(a=>a.provider===p.id).sort((a,b)=>(b.state==='waiting')-(a.state==='waiting')||b.since-a.since);
    if(acts.length){
      html+=`<div class="c-sessions">`;
      for(const a of acts.slice(0,SESSION_ROWS)){
        const col=a.state==='waiting'?AMBER:RUNGREEN;
        html+=`<div class="s-row"><span class="s-dot" style="background:${col}"></span>${esc(a.name)}<span style="color:#808080;margin-left:auto">${esc(textCopy(a.detail))}</span></div>`;
      }
      html+=moreRow(acts.length-SESSION_ROWS)+`</div>`;
    }
  }
  html+=`<div class="c-scale"><input id="scale-range" type="range" min="40" max="125" step="5" value="${scalePct}" aria-label="${textCopy('Notch size')}" title="${textCopy('Notch size')}"><span class="c-scale-val" id="scale-val">${scalePct}%</span></div>`;
  c.innerHTML=html;
  wireScaleRow();
  wireLimitRow(p.id);
  placeCard();
}
// The card follows the hovered cell: vertically centred on it (kept inside the window), tail pointing at it
function placeCard(){
  const cell=pill.querySelector(`.cell[data-p="${hoverId}"]`)||pill;
  const cr=cell.getBoundingClientRect();
  const rr=(cell.querySelector('.ringwrap')||cell).getBoundingClientRect();
  card.style.left='';card.style.right='';card.style.top='';card.style.bottom='';card.style.transform='none';
  tail.style.left='';tail.style.right='';tail.style.top='';tail.style.bottom='';
  if(notchEdge==='right'||notchEdge==='left'){
    const cy=cr.top+cr.height/2;
    const H=innerHeight, ch=card.offsetHeight||0;
    let top=Math.round(cy-ch/2); top=Math.max(8,Math.min(top,H-ch-8));
    card.style.top=top+'px';
    // The tail's point on the hovered ring (not the cell, which includes the label below it), kept off the card's rounded corners
    const ry=rr.top+rr.height/2;
    const th=tail.getBoundingClientRect().height||36, ty=Math.max(top+16+th/2,Math.min(top+ch-16-th/2,ry));
    tail.style.top=Math.round(ty-th/2)+'px';
  }else{
    const cx=cr.left+cr.width/2;
    const W=innerWidth, cw=card.offsetWidth||226;
    let left=Math.round(cx-cw/2); left=Math.max(8,Math.min(left,W-cw-8));
    card.style.left=left+'px';
    const rx=rr.left+rr.width/2;
    const tw=tail.getBoundingClientRect().width||33;
    const tx=Math.max(left+16+tw/2,Math.min(left+cw-16-tw/2,rx));
    tail.style.left=Math.round(tx-tw/2)+'px';
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* Hover: stays expanded while either the pill or the card is under the cursor; collapses after a 250 ms grace period (upstream motion rule) */
const card=document.getElementById('card'), pill=document.getElementById('pill'), tail=document.getElementById('tail'), ctxmenu=document.getElementById('ctxmenu');
let hideTimer=null, menuPinned=false;
function showCard(){clearTimeout(hideTimer);card.classList.add('show');renderCard();armWatchdog();refreshClock();} // show first, then render: placeCard needs offsetHeight
// Nothing is broadcast when the Windows clock format changes, so ask again each time the card opens
function refreshClock(){
  invoke('get_state').then(s=>{
    if(!s||s.clock_24h===stateSnap.clock_24h) return;
    stateSnap.clock_24h=s.clock_24h;
    if(card.classList.contains('show')) renderCard();
  }).catch(()=>{});
}
function hideCard(){card.classList.remove('show');reportHot();}
function scheduleHide(){clearTimeout(hideTimer);if(!menuPinned)hideTimer=setTimeout(hideCard,250);}
// ===== Diagnostics + geometry =====
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function callq(cmd,args){ // invoke with visible failure: any command error is reported on screen (a silent .catch used to swallow them)
  return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;});
}
// Hot rectangles are reported in physical pixels (multiplied by this page's real DPR), so the Rust side does no conversion — WebView2's DPR and the window scale can disagree
function rectOf(el){const r=el.getBoundingClientRect(),k=window.devicePixelRatio||1;return [r.left*k,r.top*k,r.width*k,r.height*k];}
/* Rust gates click-through on these, so they are reported whenever the pill or card moves, not only
   when the card opens: a stale pill rectangle is a pill that cannot be clicked. */
function reportHot(){
  const cardOpen=card.classList.contains('show');
  const menuOpen=ctxmenu.classList.contains('show');
  const rects=[rectOf(pill)];
  if(cardOpen) rects.push(rectOf(tail),rectOf(card));
  if(menuOpen) rects.push(rectOf(ctxmenu));
  callq('set_hot',{rects,expanded:cardOpen||menuOpen}).catch(()=>{});
}

/* ---- Right-click menu ----------------------------------------------------
   떡배님's ask: right-clicking the notch is where "keep it on top of every other window" is
   turned on or off, intuitively (a ticked/unticked menu item), without going into Settings. */
let alwaysOnTop=true;
function ctxButton(id,label,checked){
  const role=checked===undefined?'menuitem':'menuitemcheckbox';
  const aria=checked===undefined?'':` aria-checked="${checked}"`;
  return `<button class="ctx-item" id="${id}" role="${role}"${aria}><span class="ctx-check">${checked?'&#10003;':''}</span><span>${esc(textCopy(label))}</span></button>`;
}
function renderCtxMenu(){
  ctxmenu.innerHTML=ctxButton('ctx-pin','Keep open',menuPinned)
    +'<div class="ctx-sep"></div>'+ctxButton('ctx-refresh','Refresh now')
    +'<div class="ctx-sep"></div>'+ctxButton('ctx-settings','Settings…')
    +ctxButton('ctx-aot','Always on top',alwaysOnTop)
    +ctxButton('ctx-basis','Show percent left under the rings',percentBasis==='remaining')
    +'<div class="ctx-sep"></div>'+ctxButton('ctx-quit','Quit Provider Monitor');
  document.getElementById('ctx-pin').addEventListener('click',()=>{
    menuPinned=!menuPinned;
    hideCtxMenu();
    if(menuPinned)showCard();else scheduleHide();
  });
  document.getElementById('ctx-refresh').addEventListener('click',()=>{
    hideCtxMenu();
    invoke('refresh_usage').catch(e=>notice('refresh_usage failed: '+e));
  });
  document.getElementById('ctx-aot').addEventListener('click',()=>{
    const want=!alwaysOnTop;
    alwaysOnTop=want; // felt at once; the invoke result corrects it if it somehow could not be set
    hideCtxMenu();
    invoke('set_always_on_top',{on:want}).then(v=>{alwaysOnTop=!!v;}).catch(e=>notice('set_always_on_top failed: '+e));
  });
  document.getElementById('ctx-settings').addEventListener('click',()=>{
    hideCtxMenu();
    invoke('open_settings').catch(e=>notice('open_settings failed: '+e));
  });
  document.getElementById('ctx-basis').addEventListener('click',()=>{
    const basis=percentBasis==='remaining'?'used':'remaining';
    hideCtxMenu();
    invoke('set_percent_basis',{basis}).catch(e=>notice('set_percent_basis failed: '+e));
  });
  document.getElementById('ctx-quit').addEventListener('click',()=>{
    hideCtxMenu();
    invoke('quit_app').catch(e=>notice('quit_app failed: '+e));
  });
}
function showCtxMenu(x,y){
  clearTimeout(hideTimer);
  hideCard();
  renderCtxMenu();
  ctxmenu.classList.add('show');
  // Measured after it is in the DOM and visible, then clamped so it cannot spill past the window
  // the way a native context menu never does either.
  const w=ctxmenu.offsetWidth, h=ctxmenu.offsetHeight;
  const left=Math.max(4,Math.min(x,innerWidth-w-4));
  const top=Math.max(4,Math.min(y,innerHeight-h-4));
  ctxmenu.style.left=left+'px';
  ctxmenu.style.top=top+'px';
  armWatchdog();
  reportHot();
}
function hideCtxMenu(){
  if(!ctxmenu.classList.contains('show')) return;
  ctxmenu.classList.remove('show');
  reportHot();
}
// WebView2 can omit `contextmenu` on a transparent NOACTIVATE window even though it still sends
// the right-button pointer event. Open on that earlier event and keep `contextmenu` as the normal
// browser path; the timestamp prevents the same click from opening twice.
let contextPointerOpenAt=-Infinity;
function openCtxFromEvent(e){
  e.preventDefault();
  showCtxMenu(e.clientX,e.clientY);
  contextPointerOpenAt=performance.now();
}
document.addEventListener('pointerdown',e=>{if(e.button===2)openCtxFromEvent(e);},true);
document.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(performance.now()-contextPointerOpenAt>350)showCtxMenu(e.clientX,e.clientY);
},true);
document.addEventListener('mousedown',e=>{
  if(e.button===0 && ctxmenu.classList.contains('show') && !ctxmenu.contains(e.target)) hideCtxMenu();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') hideCtxMenu();
});
/* ---- Notch size ---------------------------------------------------------
   The pill alone is scaled, with CSS `zoom` rather than `transform`: the pill is centred by
   `top:50%; transform:translateY(-50%)`, so assigning to `transform` here would wipe that out and
   throw the pill to the top of the screen. `zoom` changes the element's laid-out size instead, so
   the existing centring keeps working and `right:0` keeps it against the edge.
   The hover card is deliberately left at full size: it holds the slider, and a slider that shrank
   as it was dragged would slide out from under the cursor. */
function clampPct(v){const n=Math.round(Number(v));return isFinite(n)?Math.max(40,Math.min(125,n)):100;}
function applyPillScale(){ if(pill) pill.style.zoom=String(scalePct/100); }
function applyScale(v){
  scalePct=clampPct(v);
  const lab=document.getElementById('scale-val'); if(lab) lab.textContent=scalePct+'%';
  applyPillScale();                                       // draw it at once; do not wait on Rust
  // One save when the drag settles, not one per pixel: set_scale writes the config file and
  // broadcasts an event every time it is called. Same 150ms wait the settings window's slider uses.
  clearTimeout(scaleSaveT);
  scaleSaveT=setTimeout(()=>{invoke('set_scale',{scale:scalePct/100}).catch(()=>{});},150); // percent → fraction: 60 becomes 0.60
  // The pill just changed size, so the hot rectangles the watchdog checks are stale
  clearTimeout(scaleT);
  scaleT=setTimeout(()=>{if(card.classList.contains('show')){placeCard();armWatchdog();}},120);
}
function wireScaleRow(){
  const r=document.getElementById('scale-range'); if(!r) return;
  r.value=String(scalePct);
  r.addEventListener('input',()=>applyScale(r.value)); // live while dragging, and on arrow keys
  r.addEventListener('pointerdown',()=>{scaleDragging=true;});
  r.addEventListener('mousedown',()=>{scaleDragging=true;});
}
document.addEventListener('pointerup',()=>{scaleDragging=false;});
document.addEventListener('pointercancel',()=>{scaleDragging=false;});
document.addEventListener('mouseup',()=>{scaleDragging=false;});
function loadScale(){
  invoke('get_scale').then(v=>{
    const n=Number(v); if(isFinite(n)&&n>0) scalePct=clampPct(Math.round(n*100));
    applyPillScale(); wireScaleRow();
  }).catch(()=>{applyPillScale();});
}

function armWatchdog(){
  requestAnimationFrame(reportHot); // wait one frame so renderCard's new content is laid out before measuring
}
// Viewport fit (pure front-end fallback, independent of Rust): side windows are 360px wide and
// horizontal windows are 700px wide. Comparing a top/bottom window to 360 made the whole page
// almost 2× too large and clipped its hover card.
function fitZoom(){
  const designedWidth=(notchEdge==='top'||notchEdge==='bottom')?700:360;
  const z=innerWidth/designedWidth;
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
}
reportDpr();
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr();reportHot();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',reportDpr);

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  for(const el of pill.querySelectorAll('.cell')){ if(inRect(x,y,el.getBoundingClientRect(),6)) return el.dataset.p; }
  return null;
}
function pointerInHot(x,y){
  const p=pill.getBoundingClientRect();
  if(inRect(x,y,p,4))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  if(dragging)return; // no card while dragging
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    if(!card.classList.contains('show')) showCard();
  }
  else if(card.classList.contains('show')){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget && card.classList.contains('show')){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); }
});
listen('pointer_left',()=>{if(scaleDragging)return;clearTimeout(hideTimer);hideCard();hideCtxMenu();}).catch(()=>{});
// The size can also be changed from the settings window, which is a different window entirely.
// Ignore it while this page's own slider is being dragged, or the two would fight each other.
listen('scale',e=>{
  if(scaleDragging) return;
  const n=Number(e.payload); if(!isFinite(n)||n<=0) return;
  scalePct=clampPct(Math.round(n*100));
  applyPillScale();
  const r=document.getElementById('scale-range');
  if(r){r.value=String(scalePct);const lab=document.getElementById('scale-val');if(lab)lab.textContent=scalePct+'%';}
}).catch(()=>{});
listen('percent_basis',e=>{
  percentBasis=e.payload==='used'?'used':'remaining';
  renderRing();
  if(card.classList.contains('show')) renderCard();
}).catch(()=>{});
// Card content changes change its height -> report the hot rectangles again
listen('usage',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
/* The pill moves along whichever edge Settings selected. A short single click refreshes only that
   provider; a double click opens its official usage page. The short delay is necessary because a
   browser reports the first click before it knows a second one is coming. */
let press=null, dragging=false, providerClickTimer=null, lastClickProvider=null, providerClickDelay=550;
const refreshFeedback=new Map();
function startRefreshFeedback(provider){
  finishRefreshFeedback(provider);
  const cell=pill.querySelector(`.cell[data-p="${provider}"]`);
  if(!cell)return;
  cell.classList.remove('is-pending');
  cell.classList.add('is-refreshing');
  refreshFeedback.set(provider,{started:Date.now(),timeout:setTimeout(()=>finishRefreshFeedback(provider),20_000)});
}
function finishRefreshFeedback(provider){
  const feedback=refreshFeedback.get(provider); if(!feedback)return;
  clearTimeout(feedback.timeout);refreshFeedback.delete(provider);
  const remaining=Math.max(0,500-(Date.now()-feedback.started));
  setTimeout(()=>{
    if(!refreshFeedback.has(provider)) pill.querySelector(`.cell[data-p="${provider}"]`)?.classList.remove('is-refreshing');
  },remaining);
}
pill.addEventListener('mousedown',e=>{ if(e.button!==0)return; press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId}; });
document.addEventListener('mousemove',e=>{
  if(!press||dragging)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; clearTimeout(hideTimer); hideCard();
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;});
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(press&&!dragging&&press.id){
    const provider=press.id;
    if(lastClickProvider) pill.querySelector(`.cell[data-p="${lastClickProvider}"]`)?.classList.remove('is-pending');
    lastClickProvider=provider;
    pill.querySelector(`.cell[data-p="${provider}"]`)?.classList.add('is-pending');
    clearTimeout(providerClickTimer);
    providerClickTimer=setTimeout(()=>{
      startRefreshFeedback(provider);
      invoke('refresh_provider',{provider}).then(accepted=>{
        if(!accepted){finishRefreshFeedback(provider);notice('refresh_provider rejected: '+provider);}
      }).catch(err=>{finishRefreshFeedback(provider);notice('refresh_provider failed: '+err)});
      providerClickTimer=null;
    },providerClickDelay);
  }
  press=null;
});
pill.addEventListener('dblclick',e=>{
  if(e.button!==0)return;
  clearTimeout(providerClickTimer);providerClickTimer=null;
  const provider=cellAt(e.clientX,e.clientY)||lastClickProvider||hoverId;
  if(provider) pill.querySelector(`.cell[data-p="${provider}"]`)?.classList.remove('is-pending');
  if(provider)invoke('open_provider_page',{provider}).catch(err=>notice('open_provider_page failed: '+err));
});
listen('drag_end',()=>{dragging=false;press=null;reportHot();}).catch(()=>{});

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

listen('usage',e=>{usage=e.payload||usage;renderRing();finishRefreshFeedback('claude');if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(usage) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
